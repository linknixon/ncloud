    <!-- Security Guard & Client-Side Anti-Inspection Shield -->
    <script>
      (function() {
        // Disable contextual right-click menu
        document.addEventListener('contextmenu', function(e) {
          // Allow right-click inside editable text inputs if needed
          var tag = e.target && e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return;
          e.preventDefault();
        }, false);

        // Intercept DevTools and View-Source hotkeys
        document.addEventListener('keydown', function(e) {
          // F12 key
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
          }
          // Ctrl+Shift+I / Cmd+Opt+I (Developer Tools)
          if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
            e.preventDefault();
            return false;
          }
          // Ctrl+Shift+J / Cmd+Opt+J (Console)
          if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
            e.preventDefault();
            return false;
          }
          // Ctrl+Shift+C / Cmd+Opt+C (Inspect Element)
          if ((e.ctrlKey || e.metaKey) && (e.shiftKey || e.altKey) && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
            e.preventDefault();
            return false;
          }
          // Ctrl+U / Cmd+Opt+U (View Page Source)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            return false;
          }
          // Ctrl+S / Cmd+S (Save Webpage)
          if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
            e.preventDefault();
            return false;
          }
        }, false);
      })();
